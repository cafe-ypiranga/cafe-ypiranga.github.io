    <!-- Prévia ao compartilhar (WhatsApp, Facebook, Telegram...).
         A imagem PRECISA ser URL absoluta e vir do repositório: quem monta a
         prévia é um robô que nao executa JavaScript, entao um fallback via
         onerror nao funcionaria aqui. -->

    <meta property="og:site_name" content="CAFÉ YPIRANGA">
    <meta property="og:locale" content="pt_BR">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <link rel="stylesheet" href="assets/tailwind.css">
</head>

    <header id="header" class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between py-3">
                <div class="flex items-center min-w-0">
                    <button id="category-drawer-button" aria-label="Abrir menu de categorias" class="md:hidden mr-3 text-[#0033A0] dark:text-[#FFD100] text-xl"><svg class="icon" aria-hidden="true"><use href="#i-bars"/></svg></button>
                    <img src="https://assets.olaclick.app/companies/logos/5020ff7e-3077-4507-911a-7820e15488e3.webp" alt="Café Ypiranga" class="w-12 h-12 rounded-full mr-4 border-2 border-stone-200" onerror="this.onerror=null; this.src='assets/logo.png'">
                    <div class="min-w-0">
                        <h1 class="text-xl font-bold text-[#0033A0] dark:text-[#FFD100] truncate">CAFÉ YPIRANGA</h1>
                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-1"><svg class="icon mr-1" aria-hidden="true"><use href="#i-map-marker-alt"/></svg> Santa Helena, PR</div>
                    </div>
                </div>
                <div class="flex items-center">
                    <label for="theme-toggle" class="relative inline-flex items-center cursor-pointer ml-2">
                        <input type="checkbox" value="" id="theme-toggle" aria-label="Alternar entre tema claro e escuro" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:ring-4 peer-focus:ring-yellow-300 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#0033A0]"></div>
                    </label>
                </div>
            </div>
        </div>
        <nav id="category-nav" class="hidden md:flex bg-[#0033A0] dark:bg-blue-900/80 overflow-x-auto whitespace-nowrap shadow-inner">
            <div id="category-links-desktop" class="max-w-7xl mx-auto px-4 flex py-2 space-x-2"></div>
        </nav>
    </header>

    <div id="mobile-sticky-nav" class="md:hidden bg-white/95 dark:bg-gray-800/95 backdrop-blur-md shadow-md w-full px-4 py-2 fixed top-0 left-0 right-0 z-20 transition-transform duration-300 -translate-y-full mt-[72px]">
        <div class="flex justify-between items-center text-sm">
            <span class="font-bold text-[#0033A0] dark:text-[#FFD100]" id="current-category-sticky">Cardápio</span>
            <svg class="icon text-gray-400" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </div>
    </div>

    <!-- min-h-screen reserva o espaco do cardapio: sem isso o rodape pinta
         no topo e "pula" quando os produtos entram (era o CLS de 0,22). -->
    <main id="menu-container" class="max-w-7xl mx-auto px-4 py-6 pb-24 min-h-screen"></main>

    <footer class="bg-gray-800 dark:bg-black text-gray-300 py-8 text-center pb-24">
        <p class="font-bold text-lg">CAFÉ YPIRANGA</p>
        <p class="text-sm mt-2 opacity-70">© <span id="footer-year">2024</span> Todos os direitos reservados.</p>
    </footer>

    <div class="fixed bottom-6 right-6 z-40 flex flex-col items-center gap-4">
        <button id="cart-fab" aria-label="Ver meu pedido" class="hidden relative bg-[#FFD100] text-[#0033A0] w-16 h-16 rounded-full flex items-center justify-center text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all border-4 border-white dark:border-gray-800">
            <svg class="icon" aria-hidden="true"><use href="#i-shopping-cart"/></svg>
            <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white dark:border-gray-800">0</span>
        </button>
        <button id="back-to-top" aria-label="Voltar ao topo" class="hidden bg-[#0033A0] text-white w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-lg active:scale-90 transition-all opacity-80 hover:opacity-100">
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg>
        </button>
    </div>

    <div id="product-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col md:flex-row overflow-hidden relative animate-fade-in">
            <button aria-label="Fechar" class="close-button absolute top-4 right-4 z-10 bg-black/20 hover:bg-black/40 text-white rounded-full w-8 h-8 flex items-center justify-center backdrop-blur-md transition-colors">
                <svg class="icon" aria-hidden="true"><use href="#i-times"/></svg>
            </button>
            
            <div class="w-full md:w-1/2 h-48 md:h-auto relative bg-gray-100 dark:bg-gray-700">
                <img id="modal-image" src="" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/800x600?text=Sem+Foto'">
            </div>
            
            <div class="flex flex-col p-6 flex-1 overflow-hidden">
                <div class="flex-shrink-0">
                    <h3 id="modal-name" class="text-2xl font-bold text-[#0033A0] dark:text-[#FFD100] mb-2 pr-8 leading-tight"></h3>
                    <p id="modal-description" class="text-gray-600 dark:text-gray-300 text-sm mb-4 max-h-24 overflow-y-auto"></p>
                </div>
                
                <div id="modal-addons-container" class="flex-1 overflow-y-auto pr-2 mb-4 space-y-5 border-t border-b border-gray-200 dark:border-gray-700 py-4 custom-scrollbar">
                    </div>
                
                <div class="mt-auto flex flex-col gap-4 bg-gray-50 dark:bg-gray-700/30 -m-6 p-6 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-500 dark:text-gray-400">Total do Item</span>
                        <span id="modal-total-price" class="text-2xl font-bold text-[#0033A0] dark:text-[#FFD100]"></span>
                    </div>
                    
                    <div class="flex gap-3">
                        <div class="flex items-center border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800">
                            <button id="qty-minus" aria-label="Diminuir quantidade" class="w-10 h-10 text-gray-500 hover:text-[#0033A0] text-lg font-bold">-</button>
                            <span id="qty-value" class="w-8 text-center font-bold dark:text-white">1</span>
                            <button id="qty-plus" aria-label="Aumentar quantidade" class="w-10 h-10 text-gray-500 hover:text-[#0033A0] text-lg font-bold">+</button>
                        </div>
                        <button id="add-to-order-button" class="flex-1 bg-[#FFD100] text-[#0033A0] font-bold py-3 px-6 rounded-lg hover:bg-yellow-400 transition-colors shadow-sm active:scale-[0.98]">
                            Adicionar <span class="hidden sm:inline">ao Pedido</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="category-drawer" class="hidden fixed inset-0 z-50">
        <div id="drawer-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity"></div>
        <div class="relative w-4/5 max-w-xs h-full bg-white dark:bg-gray-900 shadow-2xl flex flex-col transform transition-transform duration-300">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 dark:border-gray-800 bg-[#0033A0] text-white">
                <h2 class="text-lg font-bold">Categorias</h2>
                <button id="close-drawer-button" aria-label="Fechar menu de categorias" class="text-white/80 hover:text-white"><svg class="icon text-xl" aria-hidden="true"><use href="#i-times"/></svg></button>
            </div>
            <nav id="category-links-mobile" class="flex-1 overflow-y-auto p-2 space-y-1"></nav>
        </div>
    </div>

    <div id="order-summary-drawer" class="hidden fixed inset-0 z-50">
        <div id="order-drawer-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
        <div class="relative ml-auto w-full max-w-md h-full bg-white dark:bg-gray-900 shadow-2xl flex flex-col transform transition-transform duration-300">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 z-10">
                <h2 class="text-xl font-bold text-[#0033A0] dark:text-[#FFD100]"><svg class="icon mr-2" aria-hidden="true"><use href="#i-shopping-bag"/></svg>Seu Pedido</h2>
                <button id="close-order-drawer-button" aria-label="Fechar meu pedido" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200"><svg class="icon" aria-hidden="true"><use href="#i-times"/></svg></button>
            </div>
            
            <div id="empty-cart-msg" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400 p-8 text-center">
                <svg class="icon text-6xl mb-4 opacity-30" aria-hidden="true"><use href="#i-shopping-basket"/></svg>
                <p>Sua sacola está vazia.</p>
                <button onclick="document.getElementById('order-summary-drawer').classList.add('hidden')" class="mt-4 text-[#0033A0] dark:text-[#FFD100] font-bold text-sm hover:underline">Ver Cardápio</button>
            </div>

            <div id="order-summary-items" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 dark:bg-black/20"></div>
            
            <div class="p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10">
                <div class="flex justify-between items-center text-sm text-gray-500 mb-2">
                    <span>Subtotal</span>
                    <span id="order-subtotal">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center text-2xl font-bold text-gray-800 dark:text-white mb-6">
                    <span>Total</span>
                    <span id="order-grand-total">R$ 0,00</span>
                </div>
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-xl hover:bg-[#128C7E] transition-all shadow-lg hover:shadow-green-500/30 flex items-center justify-center text-lg">
                    <svg class="icon text-2xl mr-2" aria-hidden="true"><use href="#i-whatsapp"/></svg> Enviar Pedido
                </button>
            </div>
        </div>
    </div>

    <template id="product-card-template">
        <div class="product-card flex flex-col sm:flex-row p-4 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700/50 hover:shadow-md hover:border-[#FFD100] transition-all cursor-pointer group h-full">
            <div class="flex-1 flex flex-col justify-between order-2 sm:order-1 sm:pr-4 mt-3 sm:mt-0">
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-gray-800 dark:text-gray-100 group-hover:text-[#0033A0] dark:group-hover:text-[#FFD100] transition-colors leading-tight mb-1"></h3>
                    <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 line-clamp-2 sm:line-clamp-3 leading-relaxed"></p>
                </div>
                <div class="flex items-center justify-between mt-3">
                    <span class="price text-base sm:text-lg font-bold text-[#0033A0] dark:text-[#FFD100]"></span>
                    <span class="options-badge hidden text-[10px] font-bold bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full uppercase tracking-wide border border-yellow-200">
                        <svg class="icon mr-1" aria-hidden="true"><use href="#i-plus"/></svg>Opções
                    </span>
                </div>
            </div>
            <div class="relative w-full sm:w-28 h-32 sm:h-28 flex-shrink-0 order-1 sm:order-2 rounded-lg overflow-hidden bg-gray-100">
                <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" loading="lazy" decoding="async" alt="" onerror="this.onerror=null; this.src='https://placehold.co/400x300?text=Sem+Foto'">
            </div>
        </div>
    </template>

    <template id="addon-section-template">
        <div class="addon-section">
            <div class="addon-header flex justify-between items-center mb-2">
                <h4 class="font-bold text-gray-800 dark:text-gray-200 text-sm uppercase tracking-wide"></h4>
                <span class="badge text-[10px] font-bold px-2 py-0.5 rounded text-white"></span>
            </div>
            <div class="addon-items space-y-2"></div>
        </div>
    </template>

    <template id="addon-item-template">
        <label class="addon-item flex items-center justify-between p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50 hover:border-[#0033A0] dark:hover:border-[#FFD100] cursor-pointer transition-all select-none group">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center">
                    <input type="checkbox" class="peer w-5 h-5 border-2 border-gray-300 rounded text-[#0033A0] focus:ring-[#0033A0] checked:bg-[#0033A0] checked:border-[#0033A0]">
                </div>
                <span class="addon-name text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-white"></span>
            </div>
            <span class="addon-price text-sm font-semibold text-gray-500 dark:text-gray-400"></span>
        </label>
    </template>

    <template id="order-item-template">
        <div class="order-item bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex gap-3 relative animate-fade-in-up">
            <div class="min-w-8 shrink-0 px-1.5 flex items-center justify-center bg-gray-50 dark:bg-gray-700 rounded text-xs font-bold text-gray-500">
                <span class="qty-display">1</span>
                <span>x</span>
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start">
                    <p class="font-bold text-gray-800 dark:text-gray-100 text-sm leading-tight pr-6 name truncate"></p>
                    <button aria-label="Remover item do pedido" class="remove-item-btn text-gray-400 hover:text-red-500 transition-colors p-1 -mt-1 -mr-2"><svg class="icon" aria-hidden="true"><use href="#i-trash-alt"/></svg></button>
                </div>
                <div class="addons text-xs text-gray-500 dark:text-gray-400 mt-1 space-y-0.5"></div>
                <div class="flex justify-between items-end mt-2">
                    <p class="font-bold text-[#0033A0] dark:text-[#FFD100] text-sm price"></p>
                </div>
            </div>
        </div>
    </template>

    <script>
        const app = {
            menuData: {},
            categoryOrder: [
                "Cafés", "Cappuccinos", "Especiais", "Chocolates Quentes", "Chás", "Cafés Gelados",
                "Sucos Naturais", "Frapês", "Sanduíches", "Lanches", "Pães de Queijo", "Porções",
                "Pratos Principais", "Espetinhos", "Pizzas", "Bebidas", "Soda Italiana", "Drinks"
            ],
            orderItems: [],
            currentProductData: null,
            currentQty: 1,

            async init() {
                // Ano do rodape: fica sempre correto sem ninguem precisar editar.
                // Fora do try porque tem que valer tambem na tela de erro.
                const anoEl = document.getElementById('footer-year');
                if (anoEl) anoEl.textContent = new Date().getFullYear();

                try {
                    // Força cache bust para garantir json novo
                    const ts = new Date().getTime();
                    const res = await fetch(`menu.json?v=${ts}`);
                    if (!res.ok) throw new Error("Falha ao carregar menu.json");
                    this.menuData = await res.json();
                    this.onDomReady();
                } catch (e) {
                    console.error(e);
                    document.getElementById('menu-container').innerHTML = 
                        `<div class="flex flex-col items-center justify-center py-20 text-center px-4">
                            <svg class="icon text-4xl text-yellow-500 mb-4" aria-hidden="true"><use href="#i-exclamation-triangle"/></svg>
                            <h3 class="text-xl font-bold mb-2">Ops! O cardápio está indisponível.</h3>
                            <p class="text-gray-500">Tente recarregar a página.</p>
                            <button onclick="location.reload()" class="mt-4 bg-[#0033A0] text-white px-6 py-2 rounded-full">Recarregar</button>
                        </div>`;
                }
            },

            utils: {
                // Parseia preços suportando "R$ 10,00" e "Grátis"
                parsePrice(str) { 
                    if (!str) return 0;
                    if (typeof str === 'number') return str;
                    // Se for "Grátis", retorna 0
                    if (str.toLowerCase().includes('grátis') || str.toLowerCase().includes('gratis')) return 0;
                    // Limpa caracteres e converte vírgula
                    const clean = str.replace('R$', '').replace('Adicionais', '').trim();
                    return parseFloat(clean.replace('.', '').replace(',', '.')) || 0;
                },
                fmtPrice(val) { return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); },
                genId(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, '-'); },
                // Só o modal usa isto. O card já recebe a versão de 400px,
                // que é o tamanho em que ele realmente aparece na tela.
                highRes(url) {
                    if(!url || url.includes('placehold')) return "https://placehold.co/800x600?text=Sem+Foto";
                    return url.replace('/400/', '/800/');
                }
            },

            onDomReady() {
                this.renderMenu();
                this.initEvents();
                this.initTheme();
                this.initModalLogic();
            },

            renderMenu() {
                this.imagensAcima = 0;  // quantas fotos ja marcamos como prioritarias
                const fila = [];        // categorias esperando pra montar os cards
                const container = document.getElementById('menu-container');
                const deskLinks = document.getElementById('category-links-desktop');
                const mobLinks = document.getElementById('category-links-mobile');
                const tplCard = document.getElementById('product-card-template');

                container.innerHTML = ''; deskLinks.innerHTML = ''; mobLinks.innerHTML = '';

                // Mescla ordem manual com o que vier do JSON
                const availableCats = Object.keys(this.menuData);
                const sortedCats = [...this.categoryOrder.filter(c => availableCats.some(ac => ac.includes(c))), ...availableCats.filter(ac => !this.categoryOrder.some(oc => ac.includes(oc)))];
                // Remove duplicatas (gambiarra simples)
                const uniqueCats = [...new Set(sortedCats)];

                availableCats.forEach(catName => {
                    const catData = this.menuData[catName];
                    if (!catData || catData.items.length === 0) return;

                    const catId = this.utils.genId(catName);
                    
                    // Link Desktop
                    deskLinks.insertAdjacentHTML('beforeend', 
                        `<a href="#${catId}" class="px-5 py-2 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-[#FFD100] hover:text-[#0033A0] dark:hover:text-[#0033A0] transition-all font-medium text-sm shadow-sm whitespace-nowrap border border-gray-100 dark:border-gray-700">${catData.emoji || ''} ${catName}</a>`
                    );
                    
                    // Link Mobile
                    const mobLink = document.createElement('a');
                    mobLink.href = `#${catId}`;
                    mobLink.className = "flex items-center p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 transition-colors";
                    mobLink.innerHTML = `<span class="mr-3 text-xl">${catData.emoji || '🍽️'}</span><span class="font-medium">${catName}</span>`;
                    mobLink.onclick = () => document.getElementById('category-drawer').classList.add('hidden');
                    mobLinks.appendChild(mobLink);

                    // Seção
                    const section = document.createElement('section');
                    section.id = catId;
                    section.className = "mb-10 scroll-mt-28 animate-fade-in";
                    section.innerHTML = `
                        <div class="flex items-center mb-4 pb-2 border-b border-gray-200 dark:border-gray-700">
                            <span class="text-2xl mr-2">${catData.emoji || ''}</span>
                            <h2 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-gray-100">${catName}</h2>
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4";

                    // Os cards nao entram agora: sao 249 no total e montar
                    // todos de uma vez travava a pagina por ~700ms. Fica pra
                    // fila, processada por categoria.
                    fila.push({ grid, items: catData.items });

                    section.appendChild(grid);
                    container.appendChild(section);
                });

                // A primeira categoria entra junto com a pagina — e o que o
                // cliente ve de cara. O resto vai chegando sem travar a tela.
                if (fila.length) this.montarCards(fila.shift());
                this.montarEmLotes(fila);
            },

            /* Monta os cards de uma categoria. */
            montarCards({ grid, items }) {
                const tplCard = document.getElementById('product-card-template');
                const frag = document.createDocumentFragment();

                items.forEach(prod => {
                    const clone = tplCard.content.cloneNode(true);
                    const card = clone.querySelector('.product-card');
                    card.productData = prod;

                    card.querySelector('h3').textContent = prod.name;
                    card.querySelector('p').textContent = prod.description;
                    card.querySelector('.price').textContent = prod.price;

                    const img = card.querySelector('img');
                    // As primeiras fotos ja aparecem na tela: carregar
                    // com prioridade evita o atraso que o lazy causava.
                    if (this.imagensAcima < 4) {
                        img.loading = 'eager';
                        img.fetchPriority = 'high';
                        this.imagensAcima++;
                    }
                    img.src = prod.image;

                    // Lógica de badge de opções
                    // O Python retorna "addons" preenchido se houver
                    if (prod.addons && prod.addons.length > 0) {
                        card.querySelector('.options-badge').classList.remove('hidden');
                    }

                    frag.appendChild(card);
                });

                grid.appendChild(frag);
            },

            /* Processa a fila devolvendo o controle ao navegador entre uma
               categoria e outra, para a pagina nunca ficar travada. */
            montarEmLotes(fila) {
                if (!fila.length) return;
                const agenda = window.requestIdleCallback
                    || (fn => setTimeout(() => fn({ timeRemaining: () => 8 }), 16));

                const passo = (prazo) => {
                    // Enquanto sobrar tempo neste quadro, monta mais uma categoria.
                    while (fila.length && prazo.timeRemaining() > 6) {
                        this.montarCards(fila.shift());
                    }
                    if (fila.length) agenda(passo, { timeout: 500 });
                };
                agenda(passo, { timeout: 500 });
            },

            initModalLogic() {
                const modal = document.getElementById('product-modal');
                const els = {
                    img: document.getElementById('modal-image'),
                    name: document.getElementById('modal-name'),
                    desc: document.getElementById('modal-description'),
                    addons: document.getElementById('modal-addons-container'),
                    total: document.getElementById('modal-total-price'),
                    addBtn: document.getElementById('add-to-order-button'),
                    qtyVal: document.getElementById('qty-value'),
                    btnMinus: document.getElementById('qty-minus'),
                    btnPlus: document.getElementById('qty-plus')
                };
                
                let basePrice = 0;

                const updateTotal = () => {
                    let totalAddons = 0;
                    els.addons.querySelectorAll('input:checked').forEach(el => {
                        // Importante: dataset armazena string, converte pra float
                        totalAddons += parseFloat(el.dataset.priceVal) || 0;
                    });
                    
                    const unitPrice = basePrice + totalAddons;
                    const finalTotal = unitPrice * this.currentQty;
                    
                    els.total.textContent = this.utils.fmtPrice(finalTotal);
                };

                this.openModal = (prod) => {
                    this.currentProductData = prod;
                    this.currentQty = 1;
                    basePrice = this.utils.parsePrice(prod.price);
                    
                    els.img.src = this.utils.highRes(prod.image);
                    els.name.textContent = prod.name;
                    els.desc.textContent = prod.description;
                    els.qtyVal.textContent = "1";
                    
                    els.addons.innerHTML = '';

                    // Compatibilidade com estrutura do Python
                    // O Python gera: { group_name: "...", options: [...], required: true }
                    if (prod.addons && Array.isArray(prod.addons)) {
                        prod.addons.forEach((group, idx) => {
                            const tmpl = document.getElementById('addon-section-template').content.cloneNode(true);
                            
                            // Normalização de chaves (suporta json antigo e novo)
                            const title = group.group_name || group.title || "Opções";
                            const items = group.options || group.items || [];
                            const isRequired = group.required === true; // Garante booleano
                            const max = group.max || 99;
                            const min = group.min || 0;

                            // Badge
                            const badge = tmpl.querySelector('.badge');
                            if (isRequired) {
                                badge.textContent = "OBRIGATÓRIO";
                                badge.classList.add('bg-red-500');
                            } else {
                                badge.textContent = "OPCIONAL";
                                badge.classList.add('bg-gray-400');
                            }
                            
                            tmpl.querySelector('.addon-header h4').textContent = title;
                            
                            const container = tmpl.querySelector('.addon-items');
                            const type = max === 1 ? 'radio' : 'checkbox';
                            const groupName = `addon-grp-${idx}`;

                            items.forEach(opt => {
                                const itmTmpl = document.getElementById('addon-item-template').content.cloneNode(true);
                                const lbl = itmTmpl.querySelector('label');
                                const inp = itmTmpl.querySelector('input');
                                
                                itmTmpl.querySelector('.addon-name').textContent = opt.name;
                                itmTmpl.querySelector('.addon-price').textContent = opt.price.toLowerCase().includes('grátis') ? 'Grátis' : `+ ${opt.price}`;
                                
                                inp.type = type;
                                inp.name = groupName;
                                // SALVA O PREÇO LIMPO NO DATASET PARA CALCULO
                                inp.dataset.priceVal = this.utils.parsePrice(opt.price); 
                                inp.dataset.name = opt.name;
                                inp.dataset.rawPrice = opt.price;

                                inp.addEventListener('change', () => {
                                    // Comportamento Radio "Fake" se necessário ou validações extras
                                    updateTotal();
                                });
                                container.appendChild(itmTmpl);
                            });
                            
                            // Metadados para validação
                            const sectionDiv = tmpl.querySelector('.addon-section');
                            sectionDiv.dataset.required = isRequired;
                            sectionDiv.dataset.groupName = title;
                            
                            els.addons.appendChild(tmpl);
                        });
                    }

                    updateTotal();
                    modal.classList.remove('hidden');
                };

                els.btnMinus.onclick = () => { if(this.currentQty > 1) { this.currentQty--; els.qtyVal.textContent = this.currentQty; updateTotal(); } };
                els.btnPlus.onclick = () => { this.currentQty++; els.qtyVal.textContent = this.currentQty; updateTotal(); };

                els.addBtn.onclick = () => {
                    const selected = [];
                    let errors = [];

                    els.addons.querySelectorAll('.addon-section').forEach(sec => {
                        const checked = sec.querySelectorAll('input:checked');
                        if (sec.dataset.required === 'true' && checked.length === 0) {
                            errors.push(`Selecione uma opção em "${sec.dataset.groupName}"`);
                            sec.classList.add('ring-2', 'ring-red-500', 'rounded-lg', 'p-1');
                        } else {
                            sec.classList.remove('ring-2', 'ring-red-500', 'rounded-lg', 'p-1');
                        }
                        
                        checked.forEach(inp => {
                            selected.push({ 
                                name: inp.dataset.name, 
                                priceVal: parseFloat(inp.dataset.priceVal),
                                rawPrice: inp.dataset.rawPrice
                            });
                        });
                    });

                    if (errors.length > 0) {
                        // Treme a tela ou alerta simples
                        alert(errors.join('\n'));
                        return;
                    }

                    // Calcula total unitario real
                    let unitTotal = basePrice;
                    selected.forEach(s => unitTotal += s.priceVal);

                    this.orderItems.push({
                        ...this.currentProductData,
                        unitPrice: unitTotal,
                        qty: this.currentQty,
                        finalPrice: unitTotal * this.currentQty,
                        selectedAddons: selected
                    });

                    this.updateCartUI();
                    modal.classList.add('hidden');
                    
                    // Feedback visual
                    const fab = document.getElementById('cart-fab');
                    fab.classList.add('scale-125');
                    setTimeout(() => fab.classList.remove('scale-125'), 200);
                };
            },

            updateCartUI() {
                const list = document.getElementById('order-summary-items');
                const totalEl = document.getElementById('order-grand-total');
                const subEl = document.getElementById('order-subtotal');
                const badge = document.getElementById('cart-badge');
                const emptyMsg = document.getElementById('empty-cart-msg');
                const fab = document.getElementById('cart-fab');

                list.innerHTML = '';
                let grandTotal = 0;

                if (this.orderItems.length === 0) {
                    emptyMsg.classList.remove('hidden');
                    fab.classList.add('hidden');
                } else {
                    emptyMsg.classList.add('hidden');
                    fab.classList.remove('hidden');
                }

                this.orderItems.forEach((item, idx) => {
                    const tmpl = document.getElementById('order-item-template').content.cloneNode(true);
                    tmpl.querySelector('.name').textContent = item.name;
                    tmpl.querySelector('.price').textContent = this.utils.fmtPrice(item.finalPrice);
                    tmpl.querySelector('.qty-display').textContent = item.qty;
                    
                    const addonsDiv = tmpl.querySelector('.addons');
                    item.selectedAddons.forEach(add => {
                        addonsDiv.innerHTML += `<div class="flex justify-between"><span>+ ${add.name}</span><span>${add.rawPrice.includes('Grátis') ? '' : add.rawPrice}</span></div>`;
                    });

                    tmpl.querySelector('.remove-item-btn').onclick = () => {
                        this.orderItems.splice(idx, 1);
                        this.updateCartUI();
                    };

                    list.appendChild(tmpl);
                    grandTotal += item.finalPrice;
                });

                const totalFmt = this.utils.fmtPrice(grandTotal);
                totalEl.textContent = totalFmt;
                subEl.textContent = totalFmt;
                badge.textContent = this.orderItems.reduce((acc, it) => acc + it.qty, 0);
            },

            initEvents() {
                document.getElementById('menu-container').addEventListener('click', e => {
                    const card = e.target.closest('.product-card');
                    if(card) this.openModal(card.productData);
                });

                document.querySelectorAll('.close-button, #product-modal').forEach(el => {
                    el.addEventListener('click', e => {
                        if (e.target === el || e.target.closest('.close-button')) document.getElementById('product-modal').classList.add('hidden');
                    });
                });

                // Drawers
                const catDrawer = document.getElementById('category-drawer');
                const orderDrawer = document.getElementById('order-summary-drawer');
                
                const toggleDrawer = (id, show) => {
                    const el = document.getElementById(id);
                    if(show) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                };

                document.getElementById('category-drawer-button').onclick = () => toggleDrawer('category-drawer', true);
                document.getElementById('close-drawer-button').onclick = () => toggleDrawer('category-drawer', false);
                document.getElementById('drawer-backdrop').onclick = () => toggleDrawer('category-drawer', false);

                document.getElementById('cart-fab').onclick = () => toggleDrawer('order-summary-drawer', true);
                document.getElementById('close-order-drawer-button').onclick = () => toggleDrawer('order-summary-drawer', false);
                document.getElementById('order-drawer-backdrop').onclick = () => toggleDrawer('order-summary-drawer', false);

                // Scroll nav sticky logic
                window.addEventListener('scroll', () => {
                    const header = document.getElementById('header');
                    const sticky = document.getElementById('mobile-sticky-nav');
                    const btnTop = document.getElementById('back-to-top');
                    
                    if (window.scrollY > header.offsetHeight) {
                        sticky.classList.remove('-translate-y-full');
                        btnTop.classList.remove('hidden');
                    } else {
                        sticky.classList.add('-translate-y-full');
                        btnTop.classList.add('hidden');
                    }
                });
                
                document.getElementById('back-to-top').onclick = () => window.scrollTo({top:0, behavior:'smooth'});
            },

            initTheme() {
                const toggle = document.getElementById('theme-toggle');
                const html = document.documentElement;
                const set = (dark) => {
                    if(dark) html.classList.add('dark'); else html.classList.remove('dark');
                    localStorage.setItem('theme', dark ? 'dark' : 'light');
                    toggle.checked = dark;
                };
                
                const saved = localStorage.getItem('theme');
                if(saved) set(saved === 'dark');
                else set(window.matchMedia('(prefers-color-scheme: dark)').matches);

                toggle.onchange = () => set(toggle.checked);
            }
        };

        window.enviarPedidoWhatsApp = () => {
            if (app.orderItems.length === 0) return alert("Seu carrinho está vazio!");
            
            let msg = `*PEDIDO - CAFÉ YPIRANGA*\n----------------------------\n`;
            let total = 0;
            
            app.orderItems.forEach(item => {
                msg += `*${item.qty}x ${item.name}*\n`;
                if(item.selectedAddons.length > 0) {
                    item.selectedAddons.forEach(a => msg += `  + ${a.name}\n`);
                }
                msg += `  Subtotal: ${app.utils.fmtPrice(item.finalPrice)}\n\n`;
                total += item.finalPrice;
            });
            
            msg += `----------------------------\n*TOTAL: ${app.utils.fmtPrice(total)}*\n`;
            
            const url = `https://wa.me/554532681492?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };

        app.init();
    </script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 20px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(75, 85, 99, 0.5); }
    </style>
</body>
